plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wei.mylauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wei.mylauncher'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // 固定簽章：每次編出來的 APK 都能直接覆蓋安裝，設定不會遺失
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
